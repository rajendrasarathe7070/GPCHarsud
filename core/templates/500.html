<!DOCTYPE html>
<!--
  Custom 404 page for Government Polytechnic College, Vidyanagar.
  Self-contained (inline CSS/JS) so it renders correctly even when
  served from an unexpected URL path.
-->
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title> 500 | Government Polytechnic College</title>
  <meta name="description"
    content="The page you are looking for could not be found. Explore admissions, courses, departments and more at Government Polytechnic College, Vidyanagar." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102a5e'/%3E%3Cpath d='M32 14 56 24 32 34 8 24 32 14Z' fill='%23f4811f'/%3E%3C/svg%3E" />
  <style>
    :root {
      --brand: #102a5e;
      --brand-2: #1c4087;
      --accent: #f4811f;
      --accent-2: #ff6a00;
      --bg: #f5f8fd;
      --surface: #fff;
      --surface-2: #f0f5fc;
      --text: #15233b;
      --text-soft: #4d5d77;
      --muted: #8294af;
      --border: #e2e9f4;
      --ring: 0 0 0 3px rgba(42, 91, 184, .35);
    }

    [data-theme="dark"] {
      --brand: #5b8def;
      --brand-2: #3f6fce;
      --accent: #ff8a33;
      --bg: #070d1e;
      --surface: #111d3c;
      --surface-2: #16224a;
      --text: #e8eefb;
      --text-soft: #aebbd6;
      --muted: #7e90b4;
      --border: #21315c;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      transition: background .3s, color .3s;
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0
    }

    .wrap {
      max-width: 640px;
      width: 100%
    }

    .code {
      font-family: "Poppins", "Segoe UI", sans-serif;
      font-weight: 800;
      line-height: 1;
      font-size: clamp(6rem, 28vw, 11rem);
      letter-spacing: -.04em;
      background: linear-gradient(145deg, var(--brand), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: .5rem;
    }

    .code small {
      display: block;
      font-size: .18em;
      color: var(--accent);
      background: none;
      -webkit-text-fill-color: var(--accent);
      margin-top: .5rem;
      font-weight: 700;
      letter-spacing: .1em
    }

    h1 {
      font-family: "Poppins", sans-serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      margin: .5rem 0
    }

    p {
      color: var(--text-soft);
      max-width: 48ch;
      margin: 0 auto 1.6rem;
      font-size: 1.02rem
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      justify-content: center;
      margin-bottom: 1.8rem
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-family: "Poppins", sans-serif;
      font-weight: 600;
      padding: .75rem 1.3rem;
      border-radius: 999px;
      font-size: .95rem;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: transform .15s, background .15s, color .15s;
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .btn--accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 10px 24px rgba(244, 129, 31, .35)
    }

    .btn--ghost {
      background: transparent
    }

    .btn--ghost:hover {
      background: var(--surface-2)
    }

    :focus-visible {
      outline: none;
      box-shadow: var(--ring);
      border-radius: 8px
    }

    .search {
      display: flex;
      gap: .5rem;
      max-width: 420px;
      margin: 0 auto;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: .4rem .4rem .4rem 1rem;
      box-shadow: 0 8px 24px rgba(16, 30, 60, .06)
    }

    .search input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: .95rem;
      outline: none
    }

    .search button {
      border: none;
      background: var(--brand);
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-weight: 600;
      padding: .55rem 1.1rem;
      border-radius: 999px;
      cursor: pointer
    }

    .topbar-mini {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: .5rem;
      align-items: center
    }

    .toggle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center
    }

    .brand-mini {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-family: "Poppins", sans-serif;
      font-weight: 600;
      font-size: .9rem;
      color: var(--text)
    }

    .brand-mini .mk {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(145deg, var(--brand), var(--brand-2));
      display: grid;
      place-items: center
    }

    .head-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: .6rem
    }

    .note {
      margin-top: 1.4rem;
      font-size: .82rem;
      color: var(--muted)
    }

    .note a {
      color: var(--accent);
      font-weight: 600
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="head-row">
      <a class="brand-mini" href="index.html" aria-label="Back to home">
        <span class="mk" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="22" height="22">
            <path d="M32 14 56 24 32 34 8 24 32 14Z" fill="#f4811f" />
          </svg>
        </span>
        Govt. Polytechnic College
      </a>
      <button class="toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg id="sun" viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor"
            d="M12 7a5 5 0 1 0 5 5 5 5 0 0 0-5-5Zm0-5a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0V3a1 1 0 0 0-1-1Zm0 17a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-1-1ZM5.6 4.2 4.2 5.6l1.4 1.4 1.4-1.4-1.4-1.4Zm12 12-1.4 1.4 1.4 1.4 1.4-1.4-1.4-1.4ZM4 11H2a1 1 0 0 0 0 2h2a1 1 0 0 0 0-2Zm18 0h-2a1 1 0 0 0 0 2h2a1 1 0 0 0 0-2Z" />
        </svg>
        <svg id="moon" viewBox="0 0 24 24" width="18" height="18" style="display:none">
          <path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      </button>
    </div>

    <div class="code" aria-hidden="true">500<small>SERVER ERROR</small></div>
    <h1>{{ data.error }}</h1>
 

    <div class="links">
      <a class="btn btn--accent" href="/">⌂ Back to Home</a>
     
    </div>

   
    <p class="note">Or <a href="index.html">visit our homepage</a> to explore everything we offer.</p>
  </div>

  <script>
    (function () {
      "use strict";
      // Apply saved / system theme (mirrors the main site)
      try {
        var saved = localStorage.getItem("gpc-theme");
        var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (sysDark ? "dark" : "light"));
      } catch (e) { }
      function applyIcon() {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        document.getElementById("sun").style.display = dark ? "none" : "block";
        document.getElementById("moon").style.display = dark ? "block" : "none";
      }
      applyIcon();
      document.getElementById("themeToggle").addEventListener("click", function () {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        var next = dark ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("gpc-theme", next); } catch (e) { }
        applyIcon();
      });
    })();
    // Redirect search to the homepage with a hash the main app can pick up
   
  </script>
</body>

</html>
