{% load static %}
<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 🎯 मुख्य SEO Meta Tags -->
  <title>Cheat Sheet Notes | स्टडी और कोडिंग नोट्स डाउनलोड करें</title>
  <meta name="description" content="सभी विषयों और कोडिंग भाषाओं के सर्वश्रेष्ठ Cheat Sheets और परीक्षा नोट्स यहाँ प्राप्त करें। आसानी से खोजें और PDF या Google Drive लिंक के माध्यम से डाउनलोड करें।">
  <meta name="keywords" content="Cheat Sheet, Exam Notes, Programming Cheat Sheets, PDF Study Material, College Notes">
  <meta name="robots" content="index, follow">
  <meta name="author" content="GPC Harsud">

  <!-- 🌐 सोशल मीडिया के लिए Open Graph Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Cheat Sheet Notes | स्टडी और कोडिंग नोट्स">
  <meta property="og:description" content="क्विक रिवीजन के लिए बेहतरीन चीट शीट्स और नोट्स। डाउनलोड करें PDF फाइलें एकदम मुफ्त।">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <!-- <meta property="og:image" content="{% static 'images/seo-banner.jpg' %}"> -->

  <!-- 💅 CSS Stylesheets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- 🧭 नेविगेशन बार -->
  <nav class="navbar navbar-expand-lg" id="navbar" style="background:transparent; padding: 0% !important;">
    {% include 'navbar.html' %}
  </nav>

<div class="container py-4">

  <!-- SEO बेस्ट प्रैक्टिस: मुख्य हेडिंग हमेशा H1 होनी चाहिए -->
  <h1 class="h3 mb-3">Students HandWriten Notes</h1>

  <!-- 🔍 Search / Filter Bar -->
  <div class="row g-2 mb-3">
    <div class="col-md-4">
      <input id="searchInput" class="form-control" placeholder="Search title / content...">
    </div>
    <div class="col-md-3">
      <select id="categoryFilter" class="form-select">
        <option value="">All Categories</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="orderFilter" class="form-select">
        <option value="-created_at">Newest first</option>
        <option value="created_at">Oldest first</option>
        <option value="title">Title A-Z</option>
      </select>
    </div>
    <div class="col-md-2 text-end">
      <button class="btn btn-primary w-100" onclick="openCreate()">
        <i class="bi bi-plus-lg"></i> New
      </button>
    </div>
  </div>

  <!-- 📊 Table -->
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Title</th>
            <th>Category</th>
            <th>Owner</th>
            <th>PDF</th>
            <th>Visibility</th>
            <th>Updated</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8" class="text-center py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <nav class="mt-3">
    <ul class="pagination justify-content-center" id="pagination"></ul>
  </nav>
</div>

<!-- ============================= -->
<!-- 📝 Create / Edit Modal         -->
<!-- ============================= -->
<div class="modal fade" id="sheetModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">New Sheet</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="sheetId">

        <div class="mb-2">
          <label class="form-label" for="sheetTitle">Title</label>
          <input id="sheetTitle" class="form-control" required>
        </div>

        <div class="mb-2">
          <label class="form-label" for="sheetCategory">Category</label>
          <select id="sheetCategory" class="form-select"></select>
        </div>

        <div class="mb-2">
          <label class="form-label" for="sheetContent">Content</label>
          <textarea id="sheetContent" class="form-control" rows="4"></textarea>
        </div>

        <!-- 🆕 PDF source -->
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label" for="sheetFile">
              Upload PDF <small class="text-muted">(file)</small>
            </label>
            <input id="sheetFile" type="file" accept="application/pdf" class="form-control">
            <div id="currentFile" class="form-text"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="sheetGoogleLink">
              Google Drive link <small class="text-muted">(ya ye)</small>
            </label>
            <input id="sheetGoogleLink" type="url" class="form-control"
                   placeholder="https://drive.google.com/file/d/.../view">
            <div class="form-text">Public share link paste karo.</div>
          </div>
        </div>

        <div class="form-check mt-3">
          <input id="sheetPublic" type="checkbox" class="form-check-input" checked>
          <label class="form-check-label" for="sheetPublic">Public</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" onclick="saveSheet()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================= -->
<!-- ⚙️ Scripts                    -->
<!-- ============================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* =========================================================
   Globals
   ========================================================= */
const API = "/api";
let modal;
let currentPage = 1;

/* =========================================================
   Init
   ========================================================= */
document.addEventListener("DOMContentLoaded", () => {
  modal = new bootstrap.Modal(document.getElementById("sheetModal"));

  loadCategories();
  loadSheets();

  document.getElementById("searchInput")
    .addEventListener("input", debounce(() => loadSheets(1), 400));
  document.getElementById("categoryFilter")
    .addEventListener("change", () => loadSheets(1));
  document.getElementById("orderFilter")
    .addEventListener("change", () => loadSheets(1));
});

/* =========================================================
   Helpers
   ========================================================= */
function getCookie(name) {
  const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return v ? v.pop() : '';
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

/* =========================================================
   Categories
   ========================================================= */
async function loadCategories() {
  try {
    const res  = await fetch(`${API}/categories/`);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.results || []);
    const opts = list.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");

    document.getElementById("categoryFilter").innerHTML =
      `<option value="">All Categories</option>${opts}`;
    document.getElementById("sheetCategory").innerHTML =
      `<option value="">-- None --</option>${opts}`;
  } catch (e) {
    console.error("Categories load failed", e);
  }
}

/* =========================================================
   Load Sheets
   ========================================================= */
async function loadSheets(page = 1) {
  currentPage = page;

  const search   = document.getElementById("searchInput").value.trim();
  const category = document.getElementById("categoryFilter").value;
  const ordering = document.getElementById("orderFilter").value;

  const params = new URLSearchParams({ page, ordering });
  if (search)   params.set("search", search);
  if (category) params.set("category", category);

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4">Loading...</td></tr>`;

  let data;
  try {
    const res = await fetch(`${API}/sheets/?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (e) {
    console.error(e);
    tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-4">
        Failed to load data</td></tr>`;
    return;
  }

  const rows = data.results || data;
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4">No records</td></tr>`;
    document.getElementById("pagination").innerHTML = "";
    return;
  }

  /* -------- Build table rows -------- */
  tbody.innerHTML = rows.map((s, i) => {
    const canEdit = s.can_edit;

    // ✅ PDF cell — direct link, new tab
    let pdfCell = `<span class="text-muted small">—</span>`;
    if (s.pdf_view_url) {
      const badge = s.file ? "File" : "Drive";
      pdfCell = `<a class="btn btn-sm btn-outline-danger"
                   href="${s.pdf_view_url}"
                   target="_blank"
                   rel="noopener noreferrer">
                   <i class="bi bi-file-earmark-pdf"></i> ${badge}
                 </a>`;
    }

    // ✅ Permission-based action buttons
    const actions = canEdit
      ? `<button class="btn btn-sm btn-outline-primary me-1"
                onclick='openEdit(${JSON.stringify(s).replace(/'/g, "&#39;")})'
                title="Edit">
           <i class="bi bi-pencil"></i>
         </button>
         <button class="btn btn-sm btn-outline-danger"
                onclick="deleteSheet(${s.id})"
                title="Delete">
           <i class="bi bi-trash"></i>
         </button>`
      : `<span class="text-muted small"><i class="bi bi-lock"></i> read only</span>`;

    return `<tr>
      <td>${(page - 1) * 10 + i + 1}</td>
      <td><strong>${escapeHtml(s.title)}</strong></td>
      <td>${escapeHtml(s.category_name || "-")}</td>
      <td>${escapeHtml(s.owner_name || "-")}</td>
      <td>${pdfCell}</td>
      <td>${s.is_public
            ? '<span class="badge bg-success">Public</span>'
            : '<span class="badge bg-secondary">Private</span>'}</td>
      <td>${new Date(s.updated_at).toLocaleDateString()}</td>
      <td class="text-end">${actions}</td>
    </tr>`;
  }).join("");

  renderPagination(data, page);
}

/* =========================================================
   Pagination
   ========================================================= */
function renderPagination(data, activePage) {
  const el = document.getElementById("pagination");
  if (!el) return;

  if (!data.count || data.count <= 10) { el.innerHTML = ""; return; }

  const totalPages = Math.ceil(data.count / 10);
  let html = "";

  html += `<li class="page-item ${data.previous ? "" : "disabled"}">
             <button class="page-link" onclick="loadSheets(${activePage - 1})">
               Previous
             </button>
           </li>`;

  for (let p = 1; p <= totalPages; p++) {
    html += `<li class="page-item ${p === activePage ? "active" : ""}">
               <button class="page-link" onclick="loadSheets(${p})">${p}</button>
             </li>`;
  }

  html += `<li class="page-item ${data.next ? "" : "disabled"}">
             <button class="page-link" onclick="loadSheets(${activePage + 1})">
               Next
             </button>
           </li>`;

  el.innerHTML = html;
}

/* =========================================================
   Create / Edit Modal
   ========================================================= */
function openCreate() {
  document.getElementById("modalTitle").textContent = "New Sheet";
  document.getElementById("sheetId").value = "";
  document.getElementById("sheetTitle").value = "";
  document.getElementById("sheetCategory").value = "";
  document.getElementById("sheetContent").value = "";
  document.getElementById("sheetFile").value = "";
  document.getElementById("sheetGoogleLink").value = "";
  document.getElementById("sheetPublic").checked = true;
  document.getElementById("currentFile").innerHTML = "";
  modal.show();
}

function openEdit(sheet) {
  document.getElementById("modalTitle").textContent = "Edit Sheet";
  document.getElementById("sheetId").value = sheet.id;
  document.getElementById("sheetTitle").value = sheet.title || "";
  document.getElementById("sheetCategory").value = sheet.category || "";
  document.getElementById("sheetContent").value = sheet.content || "";
  document.getElementById("sheetFile").value = "";                       // reset
  document.getElementById("sheetGoogleLink").value = sheet.google_link || "";  // ✅ correct name
  document.getElementById("sheetPublic").checked = !!sheet.is_public;

  document.getElementById("currentFile").innerHTML = sheet.file_url
    ? `Current: <a href="${sheet.file_url}" target="_blank">view</a>`
    : "";
  modal.show();
}

/* =========================================================
   Save (Create / Update)
   ========================================================= */
async function saveSheet() {
  const id         = document.getElementById("sheetId").value;
  const title      = document.getElementById("sheetTitle").value.trim();
  const category   = document.getElementById("sheetCategory").value;
  const content    = document.getElementById("sheetContent").value;
  const googleLink = document.getElementById("sheetGoogleLink").value.trim();
  const isPublic   = document.getElementById("sheetPublic").checked;
  const fileInput  = document.getElementById("sheetFile");

  /* 🔎 Validation */
  if (!title) { alert("Title is required!"); return; }
  if (!id && !fileInput.files.length && !googleLink) {
    alert("File ya Google link me se ek zaroor do.");
    return;
  }

  /* 📦 FormData (file + link + text) */
  const fd = new FormData();
  fd.append("title", title);
  fd.append("category", category || "");
  fd.append("content", content);
  fd.append("google_link", googleLink);
  fd.append("is_public", isPublic);
  if (fileInput.files.length) {
    fd.append("file", fileInput.files[0]);         // ✅ single file
  }

  const url    = id ? `${API}/sheets/${id}/` : `${API}/sheets/`;
  const method = id ? "PATCH" : "POST";            // ✅ PATCH for update

  try {
    const res = await fetch(url, {
      method,
      headers: { "X-CSRFToken": getCookie("csrftoken") },  // ❗ Content-Type mat do
      body: fd,
    });

    if (res.ok) {
      modal.hide();
      loadSheets(currentPage);
    } else {
      const err = await res.json().catch(() => ({}));
      alert("Error saving:\n" + JSON.stringify(err, null, 2));
    }
  } catch (e) {
    console.error(e);
    alert("Something went wrong!");
  }
}

/* =========================================================
   Delete
   ========================================================= */
async function deleteSheet(id) {
  if (!confirm("Are you sure you want to delete this sheet?")) return;

  try {
    const res = await fetch(`${API}/sheets/${id}/`, {
      method: "DELETE",
      headers: { "X-CSRFToken": getCookie("csrftoken") },
    });

    if (res.status === 204) {
      loadSheets(currentPage);
    } else {
      alert("Delete failed (permission?).");
    }
  } catch (e) {
    console.error(e);
    alert("Something went wrong!");
  }
}
</script>

</body>
</html>
