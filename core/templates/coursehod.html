<div class="container my-3 my-md-5">
    <style>
       body {
        overflow-x: hidden;
       }

        .dept-strip-item {
            position: relative;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 50px !important; /* पिल शेप (गोल किनारे) */
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        /* बैकग्राउंड में हल्का सा इमेज वाटरमार्क इफ़ेक्ट */
        .dept-strip-item::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85)), var(--bg-img);
            background-size: cover;
            background-position: center;
            z-index: 1;
            opacity: 0.15; /* बहुत हल्का ताकि स्पेस साफ दिखे */
            transition: opacity 0.3s ease;
        }

        /* कंटेंट को बैकग्राउंड से ऊपर रखने के लिए */
        .dept-strip-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            width: 90%;
            gap: 12px;
        }

        /* आइकॉन स्टाइल - आपके ब्राउन शेड से मैच करता हुआ */
        .dept-strip-item .bi {
            color: #a52a2a; 
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .dept-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #2d3748;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* 🚀 लैपटॉप/डेस्कटॉप के लिए होवर और पैडिंग एडजस्टमेंट */
        @media (min-width: 992px) {
            .dept-strip-item {
                padding: 18px 28px; /* लैपटॉप पर थोड़ा बड़ा और प्रीमियम दिखेगा */
            }
            .dept-title {
                font-size: 0.95rem;
            }
        }

        @media (hover: hover) {
            .dept-strip-item:hover {
                transform: translateY(-3px);
                border-color: #a52a2a;
                box-shadow: 0 6px 20px rgba(165, 42, 42, 0.15);
                background: #fff8f8; /* हल्का ब्राउनिश वाइट टोन */
            }
            .dept-strip-item:hover::before {
                opacity: 0.3; /* होवर पर इमेज थोड़ी साफ़ दिखेगी */
            }
            .dept-strip-item:hover .bi {
                transform: scale(1.15) rotate(5deg);
            }
        }
    </style>
