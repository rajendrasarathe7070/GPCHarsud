<style>
  /* इमेज के अनुसार बूटस्ट्रैप मोडल को कस्टमाइज करने के लिए स्टाइल */
  .alert-modal-header {
    background-color: #d9383a !important;
    /* इमेज जैसा गहरा लाल रंग */
    color: #ffffff !important;
    border-bottom: none;
    padding: 12px 20px;
  }

  .alert-modal-title {
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: clamp(1.1rem, 2vw, 1.4rem);
    text-transform: capitalize;
  }

  /* क्लोज (X) बटन को व्हाइट करने के लिए */
  .alert-btn-close {
    filter: invert(1) grayscale(1) brightness(2);
    opacity: 0.8;
  }

  .alert-btn-close:hover {
    opacity: 1;
  }

  /* अंदर की अलर्ट लिस्ट का स्टाइल */
  .alert-list {
    list-style: none;
    padding-left: 0;
    margin-bottom: 0;
    font-family: Arial, sans-serif;
  }

  .alert-list li {
    position: relative;
    padding-left: 20px;
    margin-bottom: 14px;
    font-size: clamp(0.85rem, 1.2vw, 0.98rem);
    line-height: 1.5;
    color: #000000;
    text-align: left;
    border-bottom: 1px dashed #f0f0f0;
    padding-bottom: 8px;
  }

  /* छोटा नीला ट्राइएंगल एरो बुलेट पॉइंट (जैसा इमेज में है) */
  .alert-list li::before {
    content: "▶";
    position: absolute;
    left: 0;
    top: 1px;
    color: #1a5ca8;
    /* गहरा नीला रंग */
    font-size: 0.75rem;
  }

  /* अलर्ट्स के अंदर की तारीखों को हाईलाइट करने के लिए */
  .alert-date {
    color: #d9383a;
    font-weight: bold;
  }

  .alert-success-text {
    color: #198754;
    font-weight: bold;
  }

  /* अंदर का स्क्रॉल बार कस्टमाइजेशन */
  .alert-modal-body {
    max-height: 70vh;
    /* स्क्रीन की हाइट के हिसाब से खुद एडजस्ट होगा */
    overflow-y: auto;
    padding: 20px;
  }

  .alert-modal-body::-webkit-scrollbar {
    width: 5px;
  }

  .alert-modal-body::-webkit-scrollbar-thumb {
    background-color: rgba(217, 56, 58, 0.3);
    border-radius: 4px;
  }
</style>

<!-- मोडल का मुख्य ढांचा (पेज लोड होते ही दिखने के लिए) -->
<div class="modal fade" id="importantAlertsModal" tabindex="-1" aria-labelledby="importantAlertsModalLabel"
  aria-hidden="true">
  <!-- modal-dialog-centered से यह स्क्रीन के बीचो-बीच रहेगा और modal-lg से बड़ा दिखेगा -->
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable mx-auto p-3"
    style="max-width: 850px;">
    <div class="modal-content border-0 shadow-lg rounded-2">

      <!-- मोडल हेडर (लाल पट्टी) -->
      <div class="modal-header alert-modal-header align-items-center">
        <h5 class="modal-title alert-modal-title mb-0" id="importantAlertsModalLabel">
          Important Alerts
        </h5>
        <button type="button" class="btn-close alert-btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- मोडल बॉडी (स्क्रॉल होने वाली लिस्ट) -->
      <div class="modal-body alert-modal-body bg-white">
        <ul class="alert-list">
          {%for notice in impnotices%}
        {%if notice.add_to_grand == True%}
          <li class="mb-0">
            
            {% if notice.notice_pdf %}
            <a href="{{ notice.notice_pdf.url }}" target="_blank" class="text-decoration-none fw-bold"
              style="color: #1a5ca8;">{{ notice.title }}</a>
            {% else %}
            <span data-bs-toggle="modal" data-bs-target="#noticeModalLabel{{ notice.id }}" class="fw-bold"
              style="color: #1a5ca8; cursor: pointer;">{{ notice.title }}</span>
            
            
            {% endif %}
            {% if notice.created_at %}
            <br>
            <small class="text-muted">Posted on: {{ notice.created_at|date:"d M Y" }}</small>
            {% endif %}
          </li>
          {% endif %}
          {% endfor %}

            <a href="#" class="text-decoration-none fw-bold" style="color: #1a5ca8;">Revised List of College transfer in the year 2026-27.</a>
          </li>
          
          <li>

          </li>

          <li>

        </ul>
      </div>

    </div>
  </div>
</div>

<!-- जावास्क्रिप्ट ट्रिक: इसके ज़रिए पेज खुलते ही यह Popup अपने आप सामने आ जाएगा -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // बूटस्ट्रैप 5 के मोडल इंस्टेंस को कॉल करें
    var myModal = new bootstrap.Modal(document.getElementById('importantAlertsModal'), {
      keyboard: false
    });
    // पेज लोड होते ही 800 मिलीसेकंड के बाद पॉपअप खोलें (स्मूथ एंट्री के लिए)
    setTimeout(function () {
      myModal.show();
    }, 800);
  });
</script>
