<!-- शुद्ध जावास्क्रिप्ट कोड (Pure JS - बिना किसी एरर के काम करेगा) -->
<script>
function switchTabByHash() {
    const hash = window.location.hash; // URL से #id निकालेगा
    
    if (hash) {
        const targetPane = document.querySelector(hash);
        
        if (targetPane) {
            // 1. पहले से खुले हुए सभी सेक्शन्स को छुपाएं
            document.querySelectorAll('.tab-content .tab-pane').forEach(function(pane) {
                pane.classList.remove('show', 'active');
            });
            
            // 2. जिस सेक्शन की ID मैच हुई है, उसे स्क्रीन पर दिखाएं
            targetPane.classList.add('show', 'active');
        }
    }
}

// जब पेज पहली बार लोड हो (दूसरे पेज से आने पर)
document.addEventListener("DOMContentLoaded", switchTabByHash);

// यदि यूजर उसी पेज पर है और दोबारा ड्रॉपडाउन से दूसरा ऑप्शन चुनता है
window.addEventListener("hashchange", switchTabByHash);
</script>
