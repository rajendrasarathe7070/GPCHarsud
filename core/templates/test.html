<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown and Button Toggle</title>
    <style>
        /* बटन्स और ड्रॉपडाउन की स्टाइल */
        .controls-container {
            margin-bottom: 20px;
        }
        .btn-toggle {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        select {
            padding: 10px;
            margin: 5px;
            border-radius: 4px;
            font-size: 16px;
        }

        /* सभी DIV को शुरुआत में छुपाने के लिए */
        .content-div {
            display: none; 
            padding: 20px;
            margin-top: 15px;
            border: 2px solid #007bff;
            background-color: #f8f9fa;
            border-radius: 8px;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="controls-container">
        <!-- विकल्प 1: ड्रॉपडाउन मेनू -->
        <label for="divSelector"><b>ड्रॉपडाउन से चुनें:</b></label>
        <select id="divSelector" onchange="showOnlyThisDiv(this.value)">
            <option value="">-- कोई एक चुनें --</option>
            <option value="box1">आइटम 1</option>
            <option value="box2">आइटम 2</option>
            <option value="box3">आइटम 3</option>
            <option value="box4">आइटम 4</option>
        </select>

        <br><br>

        <!-- विकल्प 2: बटन्स -->
        <b>या बटन्स से चुनें:</b>
        <button class="btn-toggle" onclick="showOnlyThisDiv('box1')">बटन 1</button>
        <button class="btn-toggle" onclick="showOnlyThisDiv('box2')">बटन 2</button>
        <button class="btn-toggle" onclick="showOnlyThisDiv('box3')">बटन 3</button>
        <button class="btn-toggle" onclick="showOnlyThisDiv('box4')">बटन 4</button>
    </div>

    <!-- ये हैं वो 4 DIV बॉक्सेस -->
    <div id="box1" class="content-div">📦 यह सिर्फ **पहला (1) DIV** है। बाकी सब छिपे हैं।</div>
    <div id="box2" class="content-div">📦 यह सिर्फ **दूसरा (2) DIV** है। बाकी सब छिपे हैं।</div>
    <div id="box3" class="content-div">📦 यह सिर्फ **तीसरा (3) DIV** है। बाकी सब छिपे हैं।</div>
    <div id="box4" class="content-div">📦 यह सिर्फ **चौथा (4) DIV** है। बाकी सब छिपे हैं。</div>

    <script>
    function showOnlyThisDiv(targetId) {
        // 1. क्लास 'content-div' वाले सभी DIV को एक साथ चुनें
        const allBoxes = document.querySelectorAll('.content-div');
        
        // 2. लूप चलाकर सभी DIV को पूरी तरह से छुपा दें
        allBoxes.forEach(function(box) {
            box.style.display = 'none';
        });

        // 3. अगर कोई ID पास की गई है, तो सिर्फ उसी DIV को दिखाएं
        if (targetId) {
            const targetBox = document.getElementById(targetId);
            if (targetBox) {
                targetBox.style.display = 'block';
            }
            
            // 4. ड्रॉपडाउन की वैल्यू को भी बटन्स के साथ सिंक (Sync) रखें
            document.getElementById('divSelector').value = targetId;
        } else {
            // अगर ड्रॉपडाउन में वापस डिफ़ॉल्ट चुनें, तो सब बंद हो जाएगा
            document.getElementById('divSelector').value = "";
        }
    }
    </script>

</body>
</html>
