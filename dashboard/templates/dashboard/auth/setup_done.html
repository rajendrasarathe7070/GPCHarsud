{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>2FA Enabled</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dashboard/css/spark-style.css' %}">
  <style>
    body { background: linear-gradient(135deg, #072b1e 0%, #0f3d2b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: #fff; border-radius: 1.5rem; padding: 3rem; max-width: 500px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.4); text-align: center; }
    .success { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #a3f307); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 2.5rem; margin-bottom: 1.5rem; }
    .backup { background: #f9fafb; padding: 1rem 1.5rem; border-radius: 0.75rem; text-align: left; font-family: monospace; }
    .btn-dark-green { background: #052e20; color: #fff; border-radius: 0.75rem; padding: 0.9rem; font-weight: 600; text-decoration: none; display: block; }
    .btn-dark-green:hover { background: #0a4a34; color: #fff; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="success"><i class="bi bi-check-lg"></i></div>
    <h3 class="fw-bold mb-2">2FA Enabled Successfully!</h3>
    <p class="text-muted mb-4">Save these backup codes in a safe place.</p>

    <div class="backup mb-4">
      <strong class="text-danger small">⚠️ SAVE THESE BACKUP CODES:</strong>
      <ul class="mt-2 mb-0">
        {% for c in backup_codes %}<li><code>{{ c }}</code></li>{% endfor %}
      </ul>
    </div>

    <a href="{% url 'dashboard:router' %}" class="btn-dark-green text-center">
      <i class="bi bi-grid-fill me-2"></i> Go to Dashboard
    </a>
  </div>
</body>
</html>
