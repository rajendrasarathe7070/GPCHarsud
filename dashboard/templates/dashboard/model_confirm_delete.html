{% extends "dashboard/base.html" %}
{% block content %}
<div class="custom-table text-center mt-5 mx-auto" style="max-width:600px;">
  <i class="bi bi-exclamation-triangle text-danger display-4 mb-3 d-block"></i>
  <h4 class="fw-bold mb-3">Confirm Deletion</h4>
  <p class="text-muted mb-4">Delete <strong>"{{ object }}"</strong>? This cannot be undone.</p>
  <form method="post" class="d-flex justify-content-center gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger rounded-pill px-4"><i class="bi bi-trash"></i> Delete</button>
    <a href="{% url 'dashboard:model_list' model_key=model_key %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
  </form>
</div>
{% endblock %}
