{% extends "dashboard/base.html" %}
{% block title %}2FA Enabled{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <i class="bi bi-check-circle text-success" style="font-size:3rem;"></i>
        <h4 class="mt-3">2FA Enabled ✅</h4>
        <p class="text-muted">Yeh backup codes safe jagah save karein. Agar phone kho jaye, in se login hoga.</p>

        <div class="alert alert-warning text-start">
          <ul class="mb-0">
            {% for c in backup_codes %}
              <li><code>{{ c }}</code></li>
            {% endfor %}
          </ul>
        </div>

        <a href="{% url 'dashboard:router' %}" class="btn btn-primary w-100 mt-2">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
